<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b12" />
    <title>Gear Line HMI Preview</title>
    <script>
      window.__gearLinePreviewErrors = [];
      window.addEventListener('error', event => {
        window.__gearLinePreviewErrors.push({
          message: event.message,
          source: event.filename,
          line: event.lineno,
          column: event.colno,
        });
      });
      window.addEventListener('unhandledrejection', event => {
        window.__gearLinePreviewErrors.push({
          message: String(event.reason && event.reason.message ? event.reason.message : event.reason),
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.web.tsx"></script>
  </body>
</html>
